name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x assinador/mvnw

      - name: Build assinador.jar
        shell: bash
        working-directory: assinador
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./mvnw.cmd -B -ntp package
          else
            ./mvnw -B -ntp package
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Build CLI assinatura
        shell: bash
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/DaviAugusto778/IIS-Sistema_Runner-202601/cmd.Version=${VERSION} \
            -X github.com/DaviAugusto778/IIS-Sistema_Runner-202601/cmd.Commit=${COMMIT} \
            -X github.com/DaviAugusto778/IIS-Sistema_Runner-202601/cmd.Date=${DATE}"
          go build -ldflags "${LDFLAGS}" -o assinatura${{ runner.os == 'Windows' && '.exe' || '' }} ./

      - name: Smoke test --version
        shell: bash
        run: ./assinatura${{ runner.os == 'Windows' && '.exe' || '' }} version

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
